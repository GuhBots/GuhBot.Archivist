# Local testing with the GuhBot Discord bot running in its own container on
# this machine. Both stacks join the shared guhbot network, where the bot
# reaches this service at http://archivist:3000. Create the network once:
#
#   docker network create guhbot
#
# Load this file with the others, for example by adding to .env:
#
#   COMPOSE_FILE=compose.yaml:compose.override.yaml:compose.local.yaml
#
# Servers whose bot runs on another machine do not need it. The bot reaches
# them over HTTPS instead. See docs/guides/connecting-the-bot.md.

services:
  app:
    networks:
      default:
      guhbot:
        aliases: [archivist]

networks:
  guhbot:
    external: true
